<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin | Messages</title>
  <link rel="icon" type="image/png" href="assets/logo-image.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-wrapper">
    <!-- ================= SIDEBAR CONTROLS ================= -->

    <!-- Three Dash / Hamburger Button -->
    <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="Open sidebar" aria-controls="adminSidebar" aria-expanded="false">
      <i class="fa-solid fa-bars"></i>
    </button>

    <!-- Background Overlay -->
    <div id="sidebarOverlay" class="sidebar-overlay" aria-hidden="true"></div>

    <!-- ================= SIDEBAR ================= -->
    <aside id="adminSidebar" class="sidebar" aria-hidden="true">
      <!-- Close Button -->
      <button id="sidebarClose" class="sidebar-close" type="button" aria-label="Close sidebar">
        <i class="fa-solid fa-xmark"></i>
      </button>
      
      <!-- Sidebar Header -->
      <div class="sidebar-header">

        <div class="logo-container">
          <img
            src="/assets/logo-image.png"
            alt="CoffeeCape Logo"
            class="logo-img"
          >

          <span class="logo-text">
            CoffeeCape
          </span>
        </div>
      </div>

      <!-- Navigation -->
      <nav>
        <a href="dashboard.html" class="active">
          <i class="fa-solid fa-chart-line"></i>
          <span>Dashboard</span>
        </a>

        <a href="user.html">
          <i class="fa-solid fa-users"></i>
          <span>Users</span>
        </a>

        <a href="product.html">
          <i class="fa-solid fa-burger"></i>
          <span>Products</span>
        </a>

        <a href="orders.html">
          <i class="fa-solid fa-box"></i>
          <span>Orders</span>
        </a>

        <a href="booking.html">
          <i class="fa-solid fa-calendar-check"></i>
          <span>Bookings</span>
        </a>

        <a href="messages.html">
          <i class="fa-solid fa-envelope"></i>
          <span>Messages</span>
        </a>

        <a href="setting.html">
          <i class="fa-solid fa-gear"></i>
          <span>Settings</span>
        </a>
      </nav>

      <!-- Logout -->
      <button id="logoutBtn" class="logout-btn">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Logout</span>
      </button>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <div class="page-header">
        <h2>Contact Messages</h2>
        <p>View and manage all customer messages</p>
      </div>

      <!-- MESSAGES PANEL -->
      <div class="panel large-panel">
        <table class="modern-table" id="messagesTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Subject</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody>
        <!-- Messages will load here -->
        </tbody>

        </table>
      </div>
    </main>
  </div>

  <!-- MESSAGE MODAL -->
  <div id="messageModal" class="modal-overlay">
    <div class="modal-box">
      <span id="closeModal" class="close-btn">×</span>

      <h3>Message Details</h3>

      <div id="modalContent" class="modal-content"></div>
    </div>
  </div>

  <script src="http://localhost:3000/socket.io/socket.io.js"></script>
  <script src="js/admin-messages.js"></script>
</body>
</html>
