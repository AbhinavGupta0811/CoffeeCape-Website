<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | CoffeeCape Delivery</title>

    <link
        rel="stylesheet"
        href="css/delivery-auth.css"
    >
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="brand">

                <div class="brand-icon">
                    🔑
                </div>

                <h1>CoffeeCape</h1>

                <p>Delivery Partner</p>

            </div>


            <div class="auth-heading">

                <h2>Forgot password?</h2>

                <p>
                    Enter your employee ID and we'll send a
                    password reset code to your registered email.
                </p>

            </div>


            <form
                id="forgotPasswordForm"
                novalidate
            >

                <div class="form-group">

                    <label for="employeeId">
                        Employee ID
                    </label>

                    <input
                        type="text"
                        id="employeeId"
                        name="employeeId"
                        placeholder="e.g. DEL-001"
                        autocomplete="username"
                        maxlength="30"
                        required
                    >

                    <small
                        id="employeeIdError"
                        class="field-error"
                    ></small>

                </div>


                <div
                    id="forgotPasswordMessage"
                    class="form-message"
                    role="alert"
                    aria-live="polite"
                ></div>


                <button
                    type="submit"
                    id="sendCodeButton"
                    class="primary-button"
                >

                    <span id="sendCodeButtonText">
                        Send Reset Code
                    </span>

                    <span
                        id="sendCodeSpinner"
                        class="spinner hidden"
                        aria-hidden="true"
                    ></span>

                </button>

            </form>


            <div class="auth-footer">

                <a href="login.html">
                    ← Back to Login
                </a>

            </div>

        </section>
    </main>
    <script src="js/delivery-forgot-password.js"></script>
</body>
</html>
