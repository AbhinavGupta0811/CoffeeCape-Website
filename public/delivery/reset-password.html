<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password | CoffeeCape Delivery</title>

    <link
        rel="stylesheet"
        href="css/delivery-auth.css"
    >

</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="brand">

                <div class="brand-icon">
                    🔐
                </div>

                <h1>CoffeeCape</h1>

                <p>Delivery Partner</p>

            </div>


            <div class="auth-heading">

                <h2>Reset password</h2>

                <p>
                    Enter the 6-digit code sent to your
                    registered email and create a new password.
                </p>

            </div>


            <form
                id="resetPasswordForm"
                novalidate
            >

                <!-- Employee ID -->

                <div class="form-group">

                    <label for="employeeId">
                        Employee ID
                    </label>

                    <input
                        type="text"
                        id="employeeId"
                        autocomplete="username"
                        maxlength="30"
                        required
                    >

                    <small
                        id="employeeIdError"
                        class="field-error"
                    ></small>

                </div>


                <!-- Reset Code -->

                <div class="form-group">

                    <label for="resetCode">
                        Reset Code
                    </label>

                    <input
                        type="text"
                        id="resetCode"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        maxlength="6"
                        placeholder="Enter 6-digit code"
                        required
                    >

                    <small
                        id="resetCodeError"
                        class="field-error"
                    ></small>

                </div>


                <!-- New Password -->

                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="newPassword"
                            autocomplete="new-password"
                            placeholder="Create new password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="newPassword"
                        >
                            Show
                        </button>

                    </div>

                    <small
                        id="newPasswordError"
                        class="field-error"
                    ></small>

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm New Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            autocomplete="new-password"
                            placeholder="Confirm new password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirmPassword"
                        >
                            Show
                        </button>

                    </div>

                    <small
                        id="confirmPasswordError"
                        class="field-error"
                    ></small>

                </div>


                <!-- Password Requirements -->

                <div class="password-requirements">

                    <p>Password requirements:</p>

                    <ul>

                        <li id="lengthRule">
                            At least 8 characters
                        </li>

                        <li id="uppercaseRule">
                            At least one uppercase letter
                        </li>

                        <li id="lowercaseRule">
                            At least one lowercase letter
                        </li>

                        <li id="numberRule">
                            At least one number
                        </li>

                    </ul>

                </div>


                <div
                    id="resetPasswordMessage"
                    class="form-message"
                    role="alert"
                    aria-live="polite"
                ></div>


                <button
                    type="submit"
                    id="resetPasswordButton"
                    class="primary-button"
                >

                    <span id="resetPasswordButtonText">
                        Reset Password
                    </span>

                    <span
                        id="resetPasswordSpinner"
                        class="spinner hidden"
                    ></span>

                </button>

            </form>


            <div class="auth-footer">

                <a href="login.html">
                    ← Back to Login
                </a>

            </div>

        </section>
    </main>
    <script src="js/delivery-reset-password.js"></script>
</body>
</html>
