<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Delivery Auth | CoffeeCape</title>

    <link
        rel="stylesheet"
        href="css/delivery-auth.css"
    >
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <!-- ================================
                 BRAND
            ================================= -->

            <div class="brand">

                <div class="brand-icon">
                    🚴
                </div>

                <a href="/public/Index.html"><h1>CoffeeCape</h1></a>

                <p>
                    Delivery Partner
                </p>

            </div>


            <!-- ================================
                 AUTH MODE SWITCH
            ================================= -->

            <div class="auth-tabs">

                <button
                    type="button"
                    id="loginTab"
                    class="auth-tab active"
                >
                    Login
                </button>

                <button
                    type="button"
                    id="registerTab"
                    class="auth-tab"
                >
                    Register
                </button>

            </div>


            <!-- ================================
                 LOGIN SECTION
            ================================= -->

            <div
                id="loginSection"
                class="auth-section"
            >

                <div class="auth-heading">

                    <h2>
                        Welcome back
                    </h2>

                    <p>
                        Sign in to manage your deliveries.
                    </p>

                </div>


                <form
                    id="deliveryLoginForm"
                    novalidate
                >

                    <!-- Delivery ID -->

                    <div class="form-group">

                        <label for="employeeId">
                            Delivery ID or Email
                        </label>

                        <input
                            type="text"
                            id="employeeId"
                            name="employeeId"
                            placeholder="Enter your Delivery ID or email"
                            autocomplete="username"
                            maxlength="100"
                            required
                        >

                        <small
                            class="field-error"
                            id="employeeIdError"
                        ></small>

                    </div>


                    <!-- Password -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="password-toggle"
                                aria-label="Show password"
                            >
                                Show
                            </button>

                        </div>

                        <small
                            class="field-error"
                            id="passwordError"
                        ></small>

                    </div>


                    <!-- Login Message -->

                    <div
                        class="form-message"
                        id="loginMessage"
                        role="alert"
                        aria-live="polite"
                    ></div>


                    <!-- Login Button -->

                    <button
                        type="submit"
                        id="loginButton"
                        class="primary-button"
                    >

                        <span id="loginButtonText">
                            Login
                        </span>

                        <span
                            id="loginSpinner"
                            class="spinner hidden"
                            aria-hidden="true"
                        ></span>

                    </button>

                </form>


                <!-- Login Footer -->

                <div class="auth-footer">

                    <a href="forgot-password.html">
                        Forgot password?
                    </a>

                </div>

            </div>


            <!-- ================================
                 REGISTER SECTION
            ================================= -->

            <div
                id="registerSection"
                class="auth-section hidden"
            >

                <div class="auth-heading">

                    <h2>
                        Create your account
                    </h2>

                    <p>
                        Register as a CoffeeCape delivery partner.
                    </p>

                </div>


                <form
                    id="deliveryRegisterForm"
                    novalidate
                >

                    <!-- Full Name -->

                    <div class="form-group">

                        <label for="registerName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="registerName"
                            name="name"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            maxlength="100"
                            required
                        >

                        <small
                            class="field-error"
                            id="registerNameError"
                        ></small>

                    </div>


                    <!-- Email -->

                    <div class="form-group">

                        <label for="registerEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="registerEmail"
                            name="email"
                            placeholder="Enter your email address"
                            autocomplete="email"
                            maxlength="150"
                            required
                        >

                        <small
                            class="field-error"
                            id="registerEmailError"
                        ></small>

                    </div>


                    <!-- Phone -->

                    <div class="form-group">

                        <label for="registerPhone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="registerPhone"
                            name="phone"
                            placeholder="Enter your phone number"
                            autocomplete="tel"
                            maxlength="15"
                            inputmode="numeric"
                            required
                        >

                        <small
                            class="field-error"
                            id="registerPhoneError"
                        ></small>

                    </div>


                    <!-- Registration Password -->

                    <div class="form-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="registerPassword"
                                name="password"
                                placeholder="Create a strong password"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                id="toggleRegisterPassword"
                                class="password-toggle"
                                aria-label="Show password"
                            >
                                Show
                            </button>

                        </div>

                        <small
                            class="field-error"
                            id="registerPasswordError"
                        ></small>

                    </div>


                    <!-- Confirm Password -->

                    <div class="form-group">

                        <label for="registerConfirmPassword">
                            Confirm Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="registerConfirmPassword"
                                name="confirmPassword"
                                placeholder="Confirm your password"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                id="toggleRegisterConfirmPassword"
                                class="password-toggle"
                                aria-label="Show password"
                            >
                                Show
                            </button>

                        </div>

                        <small
                            class="field-error"
                            id="registerConfirmPasswordError"
                        ></small>

                    </div>


                    <!-- Register Message -->

                    <div
                        class="form-message"
                        id="registerMessage"
                        role="alert"
                        aria-live="polite"
                    ></div>


                    <!-- Register Button -->

                    <button
                        type="submit"
                        id="registerButton"
                        class="primary-button"
                    >

                        <span id="registerButtonText">
                            Create Account
                        </span>

                        <span
                            id="registerSpinner"
                            class="spinner hidden"
                            aria-hidden="true"
                        ></span>

                    </button>

                </form>


                <!-- Register Footer -->

                <div class="auth-footer">

                    <a
                        href="#"
                        id="backToLogin"
                    >
                        Already have an account? Login
                    </a>
                </div>
            </div>
        </section>
    </main>

    <script src="js/delivery-auth.js"></script>
</body>
</html>
