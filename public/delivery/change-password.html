<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Change Password | CoffeeCape Delivery</title>

    <link
        rel="stylesheet"
        href="css/delivery-auth.css"
    >
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="brand">
                <div class="brand-icon">
                    🔐
                </div>

                <h1>CoffeeCape</h1>

                <p>Delivery Partner</p>
            </div>


            <div class="auth-heading">
                <h2>Set your password</h2>

                <p>
                    For security, you must change your temporary
                    password before continuing.
                </p>
            </div>


            <form
                id="changePasswordForm"
                novalidate
            >

                <!-- Current Password -->

                <div class="form-group">

                    <label for="currentPassword">
                        Current Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="currentPassword"
                            autocomplete="current-password"
                            placeholder="Enter current password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="currentPassword"
                        >
                            Show
                        </button>

                    </div>

                    <small
                        class="field-error"
                        id="currentPasswordError"
                    ></small>

                </div>


                <!-- New Password -->

                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="newPassword"
                            autocomplete="new-password"
                            placeholder="Create a new password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="newPassword"
                        >
                            Show
                        </button>

                    </div>

                    <small
                        class="field-error"
                        id="newPasswordError"
                    ></small>

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm New Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            autocomplete="new-password"
                            placeholder="Confirm your new password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirmPassword"
                        >
                            Show
                        </button>

                    </div>

                    <small
                        class="field-error"
                        id="confirmPasswordError"
                    ></small>

                </div>


                <!-- Password requirements -->

                <div class="password-requirements">

                    <p>Password requirements:</p>

                    <ul>
                        <li id="lengthRule">
                            At least 8 characters
                        </li>

                        <li id="uppercaseRule">
                            At least one uppercase letter
                        </li>

                        <li id="lowercaseRule">
                            At least one lowercase letter
                        </li>

                        <li id="numberRule">
                            At least one number
                        </li>
                    </ul>

                </div>


                <div
                    id="changePasswordMessage"
                    class="form-message"
                    role="alert"
                    aria-live="polite"
                ></div>


                <button
                    type="submit"
                    id="changePasswordButton"
                    class="primary-button"
                >

                    <span id="changePasswordButtonText">
                        Change Password
                    </span>

                    <span
                        id="changePasswordSpinner"
                        class="spinner hidden"
                    ></span>

                </button>

            </form>
        </section>
    </main>
    <script src="js/delivery-change-password.js"></script>
</body>
</html>
